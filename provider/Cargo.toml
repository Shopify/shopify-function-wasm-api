[package]
name = "shopify_function_provider"
version = "2.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Shopify/shopify-function-wasm-api"
homepage = "https://github.com/Shopify/shopify-function-wasm-api"
description = "Provider for the Shopify Function Wasm API"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
fbf = { git = "https://github.com/shopify-playground/functions-binary-format.git" }
shopify_function_wasm_api_core = { path = "../core", version = "0.2.0" }
bumpalo = { version = "3.20.2", features = ["collections"] }

[dev-dependencies]
serde_json = "1.0"
